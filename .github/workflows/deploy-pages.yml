name: "Deploy Dashboard to GitHub Pages"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      # D1.18 (deploy must install what CI verified): the dashboard is installed from its lockfile,
      # exactly like the `dashboard` job in ci.yml. `npm --prefix dashboard install` resolved floating
      # ranges (react ^18.2.0, vite ^5.0.0), so the deployed bundle could be built from versions the
      # tests never saw. No `|| npm install` fallback either: it turned a real failure (a lockfile out
      # of sync with package.json) into a green step.
      #
      # There is no root install step. Measured on a clean `git archive` checkout: the root has 15
      # workspaces and zero declared dependencies, its lockfile contains zero external packages, and
      # `npm ci` there only materialises the @nexa symlink farm (15 entries, 8 KB). Nothing in this
      # workflow consumes it — `node src/security/agentic-hunter.js packages` and the Vite build both
      # run with no root node_modules — and tests/deploy-ci-parity.test.js fails if a workspace ever
      # gains an external dependency without an install step being declared here.
      - name: Install pinned dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run Agentic Bug Hunter & Pre-Generate Data
        run: |
          node src/security/agentic-hunter.js packages

      # Paths are dashboard-relative because the step runs inside dashboard/ (one
      # working-directory for the whole step, so `dist/` means the same thing in all three lines).
      # The data copy has no `|| true` anymore: silently shipping dist without dashboard/data was the
      # original bug's quieter cousin. tests/deploy-ci-parity.test.js resolves these paths on disk, so
      # a repo-root-style `../data` (which does not exist from inside dashboard/) cannot come back.
      - name: Build Dashboard
        run: |
          npm run build
          mkdir -p dist/data
          cp -r data/* dist/data/
        working-directory: dashboard

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
