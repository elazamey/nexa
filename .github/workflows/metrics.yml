name: Metrics Enforcement

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache: actions/setup-node's npm caching requires a lockfile
          # (package-lock.json), and NEXA ships without one by design —
          # zero runtime and zero development dependencies.

      - name: Install dependencies
        # npm install works with or without a lockfile; npm ci requires one.
        run: npm install

      - name: Run Tests & Gather TAP output
        run: npm test

      - name: Run Security Audit
        run: npm run audit

      - name: Run Security Posture & Attacks
        run: |
          npm run posture
          npm run attacks
          npm run attacks:google

      - name: Enforce Documentation Sync
        run: npm run metrics
