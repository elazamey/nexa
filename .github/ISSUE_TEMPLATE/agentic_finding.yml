name: 🤖 Agentic Bug Hunter Finding
description: Submit a finding discovered and validated by the Agentic Bug Hunter suite
title: "[BUG-HUNTER]: "
labels: ["bug-hunter", "finding", "needs-validation"]
body:
  - type: input
    id: target
    attributes:
      label: Target Asset / Host
      placeholder: "e.g. api.target.com or Vault.sol"
    validations:
      required: true

  - type: dropdown
    id: vuln_class
    attributes:
      label: Vulnerability Class (Web2 / Web3)
      options:
        - IDOR / BOLA (CWE-639)
        - Auth Bypass / Privilege Escalation (CWE-285)
        - Server-Side Request Forgery (SSRF - CWE-918)
        - SQL / NoSQL Injection (CWE-89)
        - CORS Origin Reflection with Credentials (CWE-942)
        - TOCTOU Race Condition (CWE-367)
        - Web3 Reentrancy / State Mutation
        - Web3 Unprotected Administrative Function
        - Web3 Oracle Manipulation
        - Hardcoded Secret / Token Leak
        - JWT alg:none / Key Confusion
        - LLM Prompt Injection / Tool Hijack
    validations:
      required: true

  - type: input
    id: gate_score
    attributes:
      label: 7-Question Gate Score
      placeholder: "7/7 PASSED"
    validations:
      required: true

  - type: textarea
    id: poc_and_receipt
    attributes:
      label: PoC & NEXA Cryptographic Receipt
      description: Include the JSON receipt and Ed25519 signature generated by bughunter CLI.
    validations:
      required: true
