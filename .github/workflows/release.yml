name: "NEXA Automated Cryptographic Release & Package Publish"

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-sign-publish:
    name: Build, Sign Evidence & Publish
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@elazamey'

    # D1.20: no install step at all — and no `|| npm install`. Measured (O22/O23): no workspace under
    # packages/* or adapters/* declares a dependency and the tracked root lockfile resolves only the
    # @nexa symlink farm, so the old step produced nothing that later steps consume (tests, mesh:verify,
    # npm pack and the evidence bridge all run with no root node_modules). Worse, `|| npm install`
    # turned a genuine lockfile failure into a green step three minutes before publishing.
    # tests/release-workflow.test.js asserts the invariant that justifies this, so the day a real
    # dependency appears the workflow fails its own check instead of shipping an untested tree.
    - name: Run Full Test Suite & Mesh Verification
      run: |
        npm test
        npm run mesh:verify

    - name: Pack Distribution Libraries
      run: |
        mkdir -p dist/packages
        npm pack --pack-destination=dist/packages

    - name: Generate Cryptographic Checksums & Ed25519 Receipts
      run: |
        cd dist/packages
        sha256sum * > SHA256SUMS
        echo "📜 Checksums generated successfully:"
        cat SHA256SUMS
        
        # توليد وتوقيع إيصال الإصدار بواسطة جسر أدلة NEXA
        node -e "
          import { NexaEvidenceBridge } from '../../src/security/hunter/nexa-evidence-bridge.js';
          import fs from 'node:fs';
          const bridge = new NexaEvidenceBridge();
          const checksums = fs.readFileSync('SHA256SUMS', 'utf8');
          const receipt = bridge.signFinding({
            event: 'RELEASE_PUBLISHED',
            tag: process.env.GITHUB_REF_NAME || 'v1.0.0',
            sha256sums: checksums,
            timestamp: new Date().toISOString()
          });
          fs.writeFileSync('RELEASE_RECEIPT.json', JSON.stringify(receipt, null, 2));
          console.log('✅ Ed25519 Signed Release Receipt created.');
        "

    # D1.20: the `|| true` is gone. A step named Publish must not go green when nothing was published.
    # What remains is a decision, not a bug (D1.21): the root package is `private: true` and unscoped
    # while setup-node points GHPR at scope @elazamey, so `npm publish` cannot succeed as configured.
    # Rather than hide that, the step reads the tree: while package.json says private, it emits a
    # ::warning:: and skips; the moment someone sets private:false (resolving D1.21) the same step
    # really publishes — and a failing publish then fails the release, loudly.
    - name: Publish Package to GitHub Package Registry
      run: |
        if node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8'));process.exit(p.private?0:1)"; then
          echo "::warning::npm publish متخطًى: package.json يقول private:true — النشر محسوم بالتذكرة D1.21 لا بابتلاع الفشل"
          echo "SKIP_PUBLISH=private-package" >> "$GITHUB_STEP_SUMMARY"
        else
          npm publish --access public
        fi
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Official GitHub Release with Signed Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/packages/*
          dist/packages/SHA256SUMS
          dist/packages/RELEASE_RECEIPT.json
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
