name: Metrics Enforcement

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No install step and no cache. Measured, not inherited: no workspace under packages/* or
          # adapters/* declares a dependency, and the tracked root package-lock.json resolves only
          # @nexa workspace symlinks (15 entries, 8 KB of node_modules). So the root install that
          # used to sit here was a no-op — and its comment was wrong twice over (a lockfile does
          # exist; the design claim is zero *dependencies*). If an external dependency ever appears,
          # tests/workflow-overlap.test.js fails and names the file to change.

      # The five measurements this job used to run as separate steps (test, audit, posture, attacks,
      # attacks:google) are exactly what tools/check-metrics.mjs runs itself via runCommand, failing
      # the process on any of them — so listing them here doubled every pull_request for no extra
      # signal. ci.yml remains their gate on every PR and push (that is where a suite failure goes
      # red first); this job stays the documentation-vs-measurement gate, which is its name.
      - name: Enforce Documentation Sync
        run: npm run metrics
