name: "NEXA Invariants & Security Guard"

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  invariants-check:
    name: Verify Invariants & Restricted Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Run Security Invariants Test Suite
      run: |
        echo "🔍 Running S1-S9c Security Invariants Suite..."
        node --test tests/security.test.js
        node --test tests/grand-synthesis.test.js

    - name: Check for Unsafe Dynamic Execution (S9 Enforcement)
      run: |
        echo "🔍 Checking for unsafe dynamic execution calls (eval, Function constructor) in protocol packages..."
        IF_FOUND=$(grep -rn --include="*.js" --include="*.mjs" -E "\beval\(|\bnew Function\(" packages/ || true)
        if [ -n "$IF_FOUND" ]; then
          echo "❌ Critical Security Error: Forbidden dynamic code execution detected in packages/!"
          echo "$IF_FOUND"
          exit 1
        else
          echo "✅ S9 Invariant Check Passed: Zero unsafe dynamic execution found in packages/."
        fi

    # D1.26: كان الفحص grep حرفيًا على BEGIN…KEY|nexa:key:priv: فيُحمِرّ دائمًا بأربع مطابقات
    # لا تُفرّق: ثلاثة PEM معلَّنة throwaway في tools/google-fixtures.mjs وسطر كاشف يطابق نصّه
    # في packages/cells/celia/synthesis/src/anthropic-constitutional.js. الآن يقرّر سكربت واحد،
    # يُجرى محليًا كما في CI، والاستثناء ملفٌ في المستودع: self-model/secret-scan-allowlist.json
    # (مسار + سبب + مالك + تاريخ؛ المدخل الميت أو على مسار محذوف = فشل). بلا || وبلا || true.
    - name: Scan for Exposed Secret Patterns
      run: node tools/check-secret-scan-allowlist.mjs
